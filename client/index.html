<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ef" />
    <script>
      (() => {
        let stored = null;
        try { stored = localStorage.getItem("theme"); } catch {}
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = stored === "light" || stored === "dark" ? stored : prefersDark ? "dark" : "light";
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#101113" : "#f6f4ef");
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="font" href="/fonts/manrope-latin-variable.woff2" type="font/woff2" crossorigin />
    <link rel="preload" as="font" href="/fonts/dm-serif-display-regular-latin.woff2" type="font/woff2" crossorigin />
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
    <script>
      (() => {
        const endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        const websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        if (!endpoint || endpoint.startsWith("%") || !websiteId || websiteId.startsWith("%")) return;

        const analytics = document.createElement("script");
        analytics.defer = true;
        analytics.src = `${endpoint.replace(/\/+$/, "")}/umami`;
        analytics.dataset.websiteId = websiteId;
        document.head.append(analytics);
      })();
    </script>
  </body>
</html>
