<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="font" href="/manus-storage/manrope-latin-variable_8e611b5b.woff2" type="font/woff2" crossorigin />
    <link rel="preload" as="font" href="/manus-storage/dm-serif-display-regular-latin_cd147219.woff2" type="font/woff2" crossorigin />
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
    <script>
      (() => {
        const endpoint = "%VITE_ANALYTICS_ENDPOINT%";
        const websiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
        if (!endpoint || endpoint.startsWith("%") || !websiteId || websiteId.startsWith("%")) return;

        const analytics = document.createElement("script");
        analytics.defer = true;
        analytics.src = `${endpoint.replace(/\/+$/, "")}/umami`;
        analytics.dataset.websiteId = websiteId;
        document.head.append(analytics);
      })();
    </script>
  </body>
</html>
